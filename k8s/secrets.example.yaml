# Copy to secrets.yaml and fill in real values.
# Generate base64 values with: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: spacechatdb
type: Opaque
stringData:
  POSTGRES_USER: spacechat
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: spacechat
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: spacechatdb
type: Opaque
stringData:
  DATABASE_URL: postgresql://spacechat:CHANGE_ME@postgres:5432/spacechat
  OPENAI_API_KEY: sk-CHANGE_ME
